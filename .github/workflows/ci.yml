# Build (vet clean, gofmt clean), the tests, the generated files, the stack probe and the ECMA-262 test data, on Go
# 1.25 (the module's floor), 1.26 and 1.27 on Linux and on the newest on Windows; and on Linux, the data as its own
# scripts write it for Unicode 13 and 18 and for the grammar of ECMAScript 2020. The data
# (github.com/corvus-dotnet/ecma262-regex-test-data) is pinned to a commit; the pass is 0 wrong answers, 0 refusals of
# a valid pattern, 0 acceptances of an invalid one and 0 matches at their limit, in both encodings.
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Go ${{ matrix.go }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-latest, go: '1.25' }
        - { os: ubuntu-latest, go: '1.26' }
        - { os: ubuntu-latest, go: '1.27' }
        - { os: windows-latest, go: '1.27' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}.x
        cache: false
    - name: Formatted and vetted
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then echo "::error::not gofmt'd: $unformatted"; exit 1; fi
        go vet ./...
    - name: The expanded templates are current
      run: go run ./internal/expand -check
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The Unicode tables and the properties of strings are written from the Rust crate's, at the version this
      # engine ports.
      with:
        repository: corvus-dotnet/corvus-regex-ecma262-rs
        ref: 1036f8707c25b49d826501132619c5671431d685
        path: corvus-regex-ecma262-rs
        persist-credentials: false
    - name: The generated tables are current
      # The tables and the properties of strings of each version of Unicode, and the property names of ECMAScript 2020.
      run: |
        src=corvus-regex-ecma262-rs/corvus-regex-ecma262/src
        for major in 13 17 18; do
          python3 tools/unicode/gen_tables.py $src/tables$major.rs --check
          python3 tools/unicode/gen_strings.py $src/strings$major.rs --check
        done
        python3 tools/unicode/gen_es2020.py $src/es2020.rs --check
    - name: Test
      run: go test -count=1 ./...
    - name: Test with the race detector
      if: runner.os == 'Linux'
      run: go test -count=1 -race ./...
    - name: Test with the memory of failed places from the first step
      run: go test -count=1 .
      env:
        CORVUS_REGEX_MEMO_FROM_THE_START: '1'
    - name: The version is stamped
      # What a release does before it tags (tools/release/stamp.ps1), with a tag no release has, so that a moved or
      # renamed placeholder fails here and not in a release.
      shell: pwsh
      run: |
        ./tools/release/stamp.ps1 -Tag v99.98.97
        if (-not (Select-String -Path regex.go -SimpleMatch 'const Version = "99.98.97"' -Quiet)) { throw 'the version was not stamped' }
        go build ./...
        git checkout -- regex.go
    - name: The benchmark harness builds
      # Its own module (tools/benchmarks), which takes goja and so needs Go 1.26; the library needs 1.25.
      if: matrix.go != '1.25'
      working-directory: tools/benchmarks
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then echo "::error::not gofmt'd: $unformatted"; exit 1; fi
        go vet ./...
        go build ./...
        python3 -m py_compile industry-results.py count-gate.py v8/workloads.py
    - name: Probe for stack overflows
      # Deep, wide and long patterns in every grammar through every member, each in a process of its own with the
      # largest goroutine stack at 1 GB and at 2 MB: none may end the program (tools/stackprobe).
      run: go run ./tools/stackprobe
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 1b4c4353c4fa3fc3e318db32ef0261391519b9a5
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: The checked-in counts were made at this commit of the test data
      # The compliance of an engine too slow to judge every night is checked in beside the harness, with the commit of
      # the data it was made at (dataCommit); the benchmark page judges it against that commit. Moving the pin above
      # means working them out again (GOJA_COMPLIANCE=1, tools/benchmarks/run.sh), so they cannot fall behind it
      # unnoticed.
      if: runner.os == 'Linux'
      run: |
        pin=$(git -C ecma262-regex-test-data rev-parse HEAD)
        fail=0
        for f in $(git ls-files | grep -E '(^|/)compliance-[^/]*\.json$'); do
          made=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("dataCommit", "none"))' "$f")
          if [ "$made" != "$pin" ]; then
            echo "::error file=$f::$f was made at $made, not the data CI checks out ($pin): work its counts out again at that commit."
            fail=1
          fi
        done
        exit $fail
    - name: Run the ECMA-262 test data
      run: go run ./tools/dataset ecma262-regex-test-data/data wrong-cases.tsv
    - name: Run the ECMA-262 test data with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: go run ./tools/dataset ecma262-regex-test-data/data wrong-cases-memo.tsv
      env:
        CORVUS_REGEX_MEMO_FROM_THE_START: '1'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: runner.os == 'Linux'
      with:
        node-version: '24.22.1'
    - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
      # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
      # ECMAScript 2020 (edition.js apply), each judged with the engine set to match.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        data=ecma262-regex-test-data
        go build -o "$RUNNER_TEMP/dataset" ./tools/dataset
        failed=()
        run() {
          name=$1; shift
          out="$RUNNER_TEMP/$name"
          case "$1" in
            unicode.js) node "$data/unicode.js" apply "$2" "$out" "$data/data" ;;
            edition.js) node "$data/edition.js" apply "$out" "$2" "$data/data" ;;
          esac
          shift 2
          "$RUNNER_TEMP/dataset" "$out" "wrong-cases-$name.tsv" "$@" || failed+=("$name")
        }
        run unicode-13 unicode.js 13.0 --unicode 13
        run unicode-18 unicode.js 18.0 --unicode 18
        # An empty version is the data's own Unicode.
        run es2020 edition.js "" --edition es2020
        run es2020-unicode-13 edition.js 13.0 --edition es2020 --unicode 13
        if [ ${#failed[@]} -gt 0 ]; then echo "::error::Wrong: ${failed[*]}"; exit 1; fi
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-${{ matrix.os }}-go${{ matrix.go }}
        path: wrong-cases*.tsv

  gate:
    # The one check of this workflow that the ruleset of main requires: it passes when every job above passed (or was
    # skipped), so a job added here is required with no change to the ruleset.
    name: CI gate
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "$RESULTS"
        if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi
